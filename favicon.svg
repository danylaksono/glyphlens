<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A necklace: the ring is the instrument, the bars sit at their bearings. -->
  <rect width="32" height="32" rx="6" fill="#faf9f6"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#16181d" stroke-width="1.2"/>
  <g stroke-linecap="butt">
    <line x1="16" y1="7.5" x2="16" y2="2.5" stroke="#0072B2" stroke-width="3"/>
    <line x1="22" y1="10" x2="25.5" y2="6.5" stroke="#E69F00" stroke-width="3"/>
    <line x1="24.5" y1="16" x2="28" y2="16" stroke="#009E73" stroke-width="3"/>
    <line x1="10" y1="22" x2="6.5" y2="25.5" stroke="#CC79A7" stroke-width="3"/>
  </g>
  <circle cx="16" cy="16" r="1.6" fill="#16181d"/>
</svg>
